schema: spec-driven
# §4 contract choice (supercharge references/openspec.md): Option B.
# openspec/specs/ holds observable, consumer-facing behaviour.
# ARCHITECTURE.md holds internal objects, morphisms and laws.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

context: |
  Project: lyanne-visa — a family web app for arranging stayovers for a child (Lyanne)
  at her grandparents' house while her parents travel overseas. Parents submit
  stayover applications; hosts approve, reject or counter-propose dates; a stay is
  confirmed only when both sides accept the same dates. Confirmed stays go to
  participants' calendars as emailed .ics invites that update in place.
  Tech stack: TypeScript, Next.js (App Router, server actions) on Netlify; Supabase
  (Postgres + Auth: Google sign-in and email magic link; row-level security for
  tenant isolation); email via a Mailer port (v1 adapter: Gmail SMTP from a dedicated app
  account with an app password). Free tiers only.
  Architecture intent lives in docs/architecture-map.md and docs/<component>/ARCHITECTURE.md
  (components: stayover, delivery). Read them before designing a change.

  Architecture method: FRAMEWORK.md (Dat / Trn / Loc / Trm + §4.5 coherence laws).
  Every claim must name its object, morphism, location or transmission and map to a
  real file:symbol, a planned item, or an explicit open question. Never invent
  architecture that cannot be grounded.

rules:
  design:
    - State the model delta as objects and morphisms with signature, partiality, semantics
    - Run the §3 Consolidation check — is this a new object, or an existing object plus morphisms?
    - Name the §4.5 coherence laws the change must keep satisfied
    - Isolate effects behind ports; deduce rather than store; one source of truth for shared structure
  specs:
    - Observable, consumer-facing behaviour only — no internal class or function names
    - Every requirement carries at least one happy-path and one failure Scenario
  tasks:
    - Every new or changed morphism gets a row in docs/<component>/IMPLEMENTATION.md with its file:symbol
    - Reconcile ARCHITECTURE.md, IMPLEMENTATION.md and STATUS.md before archiving
    - Run the supercharge drift check and fix dead rows before archiving
